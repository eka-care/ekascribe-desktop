name: Release

# Push a tag and the DMG shows up on the matching GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-builder needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Swift helper for the overlay, system audio and mic monitoring.
      - name: Build the mac helper
        run: npm run build:mac-helper

      # Builds the static web export, packages, then creates the release and uploads.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release:mac:unsigned

      # Keeps the artifacts reachable even if publishing fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaarta-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The overlay helper targets net10.0-windows.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - run: npm ci

      # Builds the NSIS installer for both arches, then creates or updates the release.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_SIGNING: 'true'
        run: npm run release:win

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaarta-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
